<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="jtt-glow" cx="0.3" cy="1.07" r="1.5">
      <stop offset="0" stop-color="#fdf497"/><stop offset="0.05" stop-color="#fdf497"/>
      <stop offset="0.45" stop-color="#fd5949"/><stop offset="0.6" stop-color="#d6249f"/><stop offset="0.9" stop-color="#285aeb"/>
    </radialGradient>
    <linearGradient id="jtt-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/><stop offset="0.6" stop-color="#e5306c"/><stop offset="1" stop-color="#b8226a"/>
    </linearGradient>
    <linearGradient id="jtt-stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="0.55" stop-color="#fbe9cc"/><stop offset="1" stop-color="#e8c79a"/>
    </linearGradient>
    <clipPath id="jtt-capclip">
      <path d="M8 32 C8 17 19 7 32 7 C45 7 56 17 56 32 C56 36 52 38 47 37.5 C40 36.8 24 36.8 17 37.5 C12 38 8 36 8 32 Z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#jtt-glow)"/>
  <!-- ground shadow -->
  <ellipse cx="32" cy="57.6" rx="14" ry="2.6" fill="#2a0a24" opacity="0.28"/>
  <!-- stem -->
  <path d="M21.5 38.5 C20.2 45 19.8 51.5 21.4 55 C23.2 58.6 40.8 58.6 42.6 55 C44.2 51.5 43.8 45 42.5 38.5 Z" fill="url(#jtt-stem)" stroke="#3b0a2a" stroke-width="2" stroke-linejoin="round"/>
  <!-- shadow the cap casts on the stem -->
  <path d="M21.9 39.4 C27.5 42.4 36.5 42.4 42.1 39.4 L42.5 43 C36.5 45.4 27.5 45.4 21.5 43 Z" fill="#c9965f" opacity="0.55"/>
  <!-- stem highlight -->
  <path d="M23.6 45 C23.1 48.5 23.2 51.5 24.2 53.8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <!-- face: shiny cartoon eyes, rosy cheeks, small smile -->
  <ellipse cx="28.2" cy="47.4" rx="2.3" ry="3.5" fill="#2a0a24"/>
  <ellipse cx="35.8" cy="47.4" rx="2.3" ry="3.5" fill="#2a0a24"/>
  <circle cx="28.9" cy="46" r="1" fill="#ffffff"/>
  <circle cx="36.5" cy="46" r="1" fill="#ffffff"/>
  <circle cx="27.6" cy="48.9" r="0.45" fill="#ffffff" opacity="0.8"/>
  <circle cx="35.2" cy="48.9" r="0.45" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="24.6" cy="51.6" rx="2.1" ry="1.2" fill="#ff6f9a" opacity="0.55"/>
  <ellipse cx="39.4" cy="51.6" rx="2.1" ry="1.2" fill="#ff6f9a" opacity="0.55"/>
  <path d="M30.2 52.2 Q32 54 33.8 52.2" fill="none" stroke="#2a0a24" stroke-width="1.3" stroke-linecap="round"/>
  <!-- gills band under the cap -->
  <path d="M15 36.6 C22 35.4 42 35.4 49 36.6 C47 39.6 41 40.8 32 40.8 C23 40.8 17 39.6 15 36.6 Z" fill="#f4d7ab" stroke="#3b0a2a" stroke-width="2" stroke-linejoin="round"/>
  <!-- cap -->
  <g clip-path="url(#jtt-capclip)">
    <rect x="0" y="0" width="64" height="40" fill="url(#jtt-cap)"/>
    <!-- shade along the lower right of the dome -->
    <ellipse cx="40" cy="40" rx="24" ry="10" fill="#7d1350" opacity="0.35"/>
    <!-- spots -->
    <ellipse cx="32" cy="15.5" rx="7.2" ry="5.2" fill="#ffffff"/>
    <ellipse cx="14.5" cy="27" rx="5" ry="6.4" fill="#ffffff"/>
    <ellipse cx="49.5" cy="27" rx="5" ry="6.4" fill="#ffffff"/>
    <ellipse cx="32" cy="30.5" rx="3.6" ry="3" fill="#ffffff"/>
    <!-- spot shading -->
    <path d="M25.4 18 C28 20.6 36 20.6 38.6 18" fill="none" stroke="#f1c9d6" stroke-width="1.4" stroke-linecap="round"/>
    <!-- gloss -->
    <path d="M14 21 C16.5 14 22 10 27.5 9.2" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
  </g>
  <path d="M8 32 C8 17 19 7 32 7 C45 7 56 17 56 32 C56 36 52 38 47 37.5 C40 36.8 24 36.8 17 37.5 C12 38 8 36 8 32 Z" fill="none" stroke="#3b0a2a" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
