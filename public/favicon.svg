<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="jtt-glow" cx="0.3" cy="1.07" r="1.5">
      <stop offset="0" stop-color="#fdf497"/><stop offset="0.05" stop-color="#fdf497"/>
      <stop offset="0.45" stop-color="#fd5949"/><stop offset="0.6" stop-color="#d6249f"/><stop offset="0.9" stop-color="#285aeb"/>
    </radialGradient>
    <radialGradient id="jtt-cap" cx="0.36" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ff8e8a"/><stop offset="0.35" stop-color="#f2416b"/><stop offset="0.75" stop-color="#c8236a"/><stop offset="1" stop-color="#8f1658"/>
    </radialGradient>
    <radialGradient id="jtt-spot" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#fff4f7"/><stop offset="1" stop-color="#f1c6d8"/>
    </radialGradient>
    <radialGradient id="jtt-stem" cx="0.35" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#fffdf8"/><stop offset="0.55" stop-color="#f8e6c8"/><stop offset="1" stop-color="#d9b07c"/>
    </radialGradient>
    <linearGradient id="jtt-gills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c590"/><stop offset="1" stop-color="#f7e2bf"/>
    </linearGradient>
    <radialGradient id="jtt-eye" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#4a1640"/><stop offset="1" stop-color="#14030f"/>
    </radialGradient>
    <filter id="jtt-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="jtt-softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="jtt-capclip">
      <path d="M6 31 C6 15.5 17.5 5.5 32 5.5 C46.5 5.5 58 15.5 58 31 C58 36.5 53.5 39 47.5 38.2 C40 37.2 24 37.2 16.5 38.2 C10.5 39 6 36.5 6 31 Z"/>
    </clipPath>
    <clipPath id="jtt-stemclip">
      <path d="M20 38.5 C18.5 45.5 18.2 52 20 55.8 C22 59.6 42 59.6 44 55.8 C45.8 52 45.5 45.5 44 38.5 Z"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#jtt-glow)"/>
  <!-- soft ground shadow -->
  <ellipse cx="32" cy="58.4" rx="15" ry="2.8" fill="#2a0a24" opacity="0.35" filter="url(#jtt-softer)"/>
  <!-- chubby stem with ambient shadow under the cap -->
  <path d="M20 38.5 C18.5 45.5 18.2 52 20 55.8 C22 59.6 42 59.6 44 55.8 C45.8 52 45.5 45.5 44 38.5 Z" fill="url(#jtt-stem)" stroke="#a8794a" stroke-width="1.4" stroke-linejoin="round"/>
  <g clip-path="url(#jtt-stemclip)">
    <ellipse cx="32" cy="39.5" rx="15" ry="4.5" fill="#8a5a2c" opacity="0.45" filter="url(#jtt-soft)"/>
    <path d="M22.6 45 C22 48.6 22.2 52 23.4 54.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#jtt-soft)"/>
  </g>
  <!-- face -->
  <ellipse cx="24.4" cy="51.4" rx="2.4" ry="1.4" fill="#ff5c8d" opacity="0.6" filter="url(#jtt-soft)"/>
  <ellipse cx="39.6" cy="51.4" rx="2.4" ry="1.4" fill="#ff5c8d" opacity="0.6" filter="url(#jtt-soft)"/>
  <ellipse cx="28" cy="47.2" rx="2.6" ry="3.9" fill="url(#jtt-eye)"/>
  <ellipse cx="36" cy="47.2" rx="2.6" ry="3.9" fill="url(#jtt-eye)"/>
  <ellipse cx="28.8" cy="45.6" rx="1.15" ry="1.35" fill="#ffffff"/>
  <ellipse cx="36.8" cy="45.6" rx="1.15" ry="1.35" fill="#ffffff"/>
  <circle cx="27.3" cy="49.2" r="0.55" fill="#ffffff" opacity="0.85"/>
  <circle cx="35.3" cy="49.2" r="0.55" fill="#ffffff" opacity="0.85"/>
  <path d="M30.1 52.4 Q32 54.3 33.9 52.4" fill="none" stroke="#2a0a24" stroke-width="1.3" stroke-linecap="round"/>
  <!-- gills -->
  <path d="M14.5 37.4 C22 36 42 36 49.5 37.4 C47.5 40.4 41 41.6 32 41.6 C23 41.6 16.5 40.4 14.5 37.4 Z" fill="url(#jtt-gills)" stroke="#a8794a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- puffy cap -->
  <g clip-path="url(#jtt-capclip)">
    <rect x="0" y="0" width="64" height="40" fill="url(#jtt-cap)"/>
    <!-- domed spots -->
    <ellipse cx="32" cy="14.6" rx="7.8" ry="5.6" fill="url(#jtt-spot)"/>
    <ellipse cx="13" cy="26.5" rx="5.2" ry="7" fill="url(#jtt-spot)"/>
    <ellipse cx="51" cy="26.5" rx="5.2" ry="7" fill="url(#jtt-spot)"/>
    <ellipse cx="32" cy="30.2" rx="4" ry="3.2" fill="url(#jtt-spot)"/>
    <ellipse cx="21.5" cy="18.8" rx="2.2" ry="1.8" fill="url(#jtt-spot)"/>
    <ellipse cx="42.5" cy="18.8" rx="2.2" ry="1.8" fill="url(#jtt-spot)"/>
    <!-- underside shade and rim light -->
    <ellipse cx="32" cy="40" rx="27" ry="6.5" fill="#6d0f45" opacity="0.4" filter="url(#jtt-soft)"/>
    <path d="M9.5 34.6 C14 36.6 18 36.3 24 35.8" fill="none" stroke="#ffb3c4" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <!-- soft specular sheen and a crisp glint -->
    <ellipse cx="22" cy="13.5" rx="9" ry="4.2" fill="#ffffff" opacity="0.45" transform="rotate(-28 22 13.5)" filter="url(#jtt-soft)"/>
    <ellipse cx="18.6" cy="15" rx="2.6" ry="1.2" fill="#ffffff" opacity="0.9" transform="rotate(-35 18.6 15)"/>
  </g>
  <path d="M6 31 C6 15.5 17.5 5.5 32 5.5 C46.5 5.5 58 15.5 58 31 C58 36.5 53.5 39 47.5 38.2 C40 37.2 24 37.2 16.5 38.2 C10.5 39 6 36.5 6 31 Z" fill="none" stroke="#6a0d42" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
